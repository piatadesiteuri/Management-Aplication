<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Auth</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #e8f5e8; color: #2e7d32; padding: 10px; margin: 10px 0; border-radius: 5px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Verificare Autentificare Frontend</h1>
    
    <div id="auth-info"></div>
    
    <h2>Test API Request</h2>
    <button onclick="testAPI()">Testează API</button>
    <div id="api-result"></div>

    <script>
        function checkAuth() {
            const token = localStorage.getItem('jwt_token');
            const user = localStorage.getItem('user');
            
            const authInfo = document.getElementById('auth-info');
            
            if (!token) {
                authInfo.innerHTML = '<div class="error">❌ Nu există token în localStorage</div>';
                return;
            }
            
            if (!user) {
                authInfo.innerHTML = '<div class="error">❌ Nu există user în localStorage</div>';
                return;
            }
            
            try {
                const userObj = JSON.parse(user);
                authInfo.innerHTML = `
                    <div class="success">✅ Token găsit în localStorage</div>
                    <div class="info">
                        <strong>Token:</strong> ${token.substring(0, 50)}...<br>
                        <strong>User:</strong> ${userObj.email || 'N/A'}<br>
                        <strong>Role:</strong> ${userObj.role || 'N/A'}
                    </div>
                `;
            } catch (error) {
                authInfo.innerHTML = '<div class="error">❌ Eroare la parsarea user-ului</div>';
            }
        }
        
        async function testAPI() {
            const token = localStorage.getItem('jwt_token');
            const resultDiv = document.getElementById('api-result');
            
            if (!token) {
                resultDiv.innerHTML = '<div class="error">❌ Nu există token pentru test</div>';
                return;
            }
            
            try {
                const response = await fetch('http://localhost:3000/api/calendar/events', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="success">✅ API Request successful</div>
                        <div class="info">
                            <strong>Status:</strong> ${response.status}<br>
                            <strong>Events count:</strong> ${data.length || 0}
                        </div>
                    `;
                } else {
                    const errorData = await response.json();
                    resultDiv.innerHTML = `
                        <div class="error">❌ API Request failed</div>
                        <div class="info">
                            <strong>Status:</strong> ${response.status}<br>
                            <strong>Message:</strong> ${errorData.message || 'Unknown error'}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">❌ Network error</div>
                    <div class="info">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        // Verifică autentificarea la încărcarea paginii
        checkAuth();
    </script>
</body>
</html>
